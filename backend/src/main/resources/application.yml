server:
  port: 8080

spring:
  application:
    name: phone-recommend-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/phone_recommend?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto

app:
  jwt-secret: "phoneRecommendSystem2024SecretKeyJavaJwtMinLength32"
  sentiment-service-url: "http://localhost:8000"
  cors-origin: "http://localhost:5173"
